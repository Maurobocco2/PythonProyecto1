{% load static %}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %}Service de PC{% endblock %}</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
        />
        <link rel="stylesheet" href="{% static 'myapp/css/styles.css' %}" />
    </head>
    <body>
        <header>
            <nav class="navbar navbar-expand-lg navbar-dark">
                <div class="container">
                    <a
                        class="navbar-brand text-white"
                        href="{% url 'myapp:index' %}"
                    >
                        Inicio
                    </a>
                    <button
                        class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbarContenido"
                        aria-controls="navbarContenido"
                        aria-expanded="false"
                        aria-label="Toggle navigation"
                    >
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <div class="collapse navbar-collapse" id="navbarContenido">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0 w-100">
                            <li class="nav-item flex-fill text-center">
                                <a
                                    class="nav-link text-white btn btn-primary bi bi-people-fill me-2"
                                    href="{% url 'myapp:clientes' %}"
                                >
                                    <span class="ms-2">Clientes</span>
                                </a>
                            </li>
                            <li class="nav-item flex-fill text-center">
                                <a
                                    class="nav-link text-white btn btn-primary bi bi-headset"
                                    href="{% url 'myapp:tecnicos' %}"
                                >
                                    <span class="ms-2">Tecnicos</span>
                                </a>
                            </li>
                            <li class="nav-item flex-fill text-center">
                                <a
                                    class="nav-link text-white btn btn-primary bi bi-pc-display"
                                    href="{% url 'myapp:equipos' %}"
                                >
                                    <span class="ms-2">Equipos</span>
                                </a>
                            </li>
                            <li class="nav-item flex-fill text-center">
                                <a
                                    class="nav-link text-white btn btn-primary bi bi-tools"
                                    href="{% url 'myapp:reparaciones' %}"
                                >
                                    <span class="ms-2">Reparaciones</span>
                                </a>
                            </li>
                            <li class="nav-item flex-fill text-center">
                                <a
                                    class="nav-link text-white btn btn-primary"
                                    href="#NADAAUN"
                                >
                                    Iniciar sesión
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>
        <main>
            {% block content %}
            <!-- Contenido Especifico de cada paquina aqui  -->{% endblock%}
        </main>
        <footer>
            <div class="container">
                <p class="mb-0">
                    &copy; 2026 Service PC. Todos los derechos reservados.
                </p>
            </div>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
